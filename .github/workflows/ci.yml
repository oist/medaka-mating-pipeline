name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (minimal)
        run: |
          python -m pip install --upgrade pip
          pip install -r environment/requirements.txt || true
          pip install pytest || true
      - name: Run tests
        env:
          PYTHONPATH: .:src
        run: |
          pytest -q
