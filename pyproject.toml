[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medaka-mating-pipeline"
version = "0.1.0"
description = "Pipeline for acquisition, calibration, tracking, and analysis of medaka mating behavior."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "makoto hiroi" }]

# 校准、SLEAP 追踪、3D 重建、行为分析等全流程依赖
dependencies = [
    "imageio-ffmpeg>=0.5.0",
    "joblib>=1.5.3",
    "matplotlib>=3.10.8",
    "numpy>=2.3.5",
    "opencv-python>=4.11.0.86",
    "pandas>=2.3.3",
    "pillow>=10.0.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.14.1",
    "seaborn>=0.13.0",
    "sleap[nn]>=1.5.2",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "torchaudio>=2.6.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=7.1.0",
  "pytest>=7",
]
sleap = [
  "sleap-io",
]

[dependency-groups]
dev = [
  "ipykernel>=7.1.0",
  "pytest>=7",
]
sleap = [
  "sleap-io",
]

# uv：Windows/Linux 使用 PyTorch CUDA 13.0（与当前驱动一致）；macOS 使用 PyPI 的 CPU 版
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.setuptools]
package-dir = {"" = "src", "scripts" = "scripts"}

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["medaka_pipeline*", "scripts*"]
