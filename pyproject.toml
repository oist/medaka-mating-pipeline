[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medaka-mating-pipeline"
version = "0.1.0"
description = "Pipeline for acquisition, calibration, tracking, and analysis of medaka mating behavior."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "makoto hiroi" }]

# End-to-end dependencies for calibration, SLEAP tracking, 3D reconstruction,
# and behavior analysis.
dependencies = [
    "imageio-ffmpeg>=0.5.0",
    "joblib>=1.5.3",
    "matplotlib>=3.10.8",
    "numpy>=2.3.5",
    "opencv-python>=4.11.0.86",
    "pandas>=2.3.3",
    "pillow>=10.0.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.14.1",
    "seaborn>=0.13.0",
    "sleap[nn]>=1.6.3",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "torchaudio>=2.6.0",
    "tqdm>=4.66.0",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=7.1.0",
  "pytest>=7",
  "visidata>=3.0",
]
sleap = [
  "sleap-io",
]
rerun = [
  "rerun-sdk>=0.22",
]
# Multi-view annotation GUIs in scripts/sleap/ (napari + PyQt5 stack).
# Install with `uv sync --extra gui` (or `--all-extras`).
gui = [
  "napari>=0.5",
  "PyQt5>=5.15",
  # pyqt5-qt5 has no Windows wheels after 5.15.2; pin on Windows only.
  "PyQt5-Qt5==5.15.2; sys_platform == 'win32'",
  "magicgui>=0.10",
  "superqt>=0.7",
]
# TensorRT inference convenience extras for the sleap-nn -> TRT path
# (see memory/project_tensorrt_inference.md). Not imported by repo Python,
# but kept here so `uv sync --extra tensorrt` installs the needed runtime.
tensorrt = [
  "tensorrt>=10.0",
  "onnx>=1.16",
  "onnxruntime-gpu>=1.20",
  "onnxslim>=0.1",
]

[dependency-groups]
dev = [
  "ipykernel>=7.1.0",
  "isort>=8.0.1",
  "pytest>=7",
  "visidata>=3.0",
]
sleap = [
  "sleap-io",
]
rerun = [
  "rerun-sdk>=0.22",
]
gui = [
  "napari>=0.5",
  "PyQt5>=5.15",
  # pyqt5-qt5 has no Windows wheels after 5.15.2; pin on Windows only.
  "PyQt5-Qt5==5.15.2; sys_platform == 'win32'",
  "magicgui>=0.10",
  "superqt>=0.7",
]
tensorrt = [
  "tensorrt>=10.0",
  "onnx>=1.16",
  "onnxruntime-gpu>=1.20",
  "onnxslim>=0.1",
]

# uv configuration:
# - Windows/Linux use the PyTorch CUDA 13.0 index.
# - macOS falls back to the CPU build from PyPI.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv]
# `sleap` and `rerun` are needed by the common-path scripts (track_simple_nn,
# bind_topcam_id, rerun_viewer), so include them in the default install.
# `gui` and `tensorrt` stay opt-in (Qt platform plugins / CUDA-only).
default-groups = ["dev", "sleap", "rerun"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.setuptools]
package-dir = {"" = "src", "scripts" = "scripts"}

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["medaka_pipeline*", "scripts*"]
