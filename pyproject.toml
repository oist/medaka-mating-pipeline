[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medaka-mating-pipeline"
version = "0.1.0"
description = "Pipeline for acquisition, calibration, tracking, and analysis of medaka mating behavior."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "makoto hiroi" }]

# Keep this minimal; add runtime deps as they become concrete.
dependencies = []

[dependency-groups]
dev = [
  "pytest>=7",
]

# Optional: install SLEAP-related Python modules into the project venv for
# analysis scripts/notebooks (separate from `uv tool install ...` for the CLI).
sleap = [
  "sleap-io",
]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
