sleap:
  # Model directories as produced by SLEAP training.
  #
  # For `sleap-track`, these should be paths to a trained model directory
  # containing `training_config.json`.
  #
  # For top-down pipelines, specify centroid first, then instance.
  centroid_model_dir: /path/to/centroid_model_dir
  instance_model_dir: /path/to/instance_model_dir
